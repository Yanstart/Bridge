[project]
name = "iot-edge-bridge"
version = "0.1.0"
description = "IoT Edge Bridge: passerelle d'interoperabilite pour dispositifs medicaux Legacy."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Noel Junior Yando Fotso", email = "junior.noel@facsciences-uy1.cm" }
]
license = { text = "MIT" }

dependencies = [
    # Pins hauts impératifs : starlette 1.0 a change la signature de
    # TemplateResponse en mai 2026 (request en 1er argument). Le code
    # actuel utilise la nouvelle signature, mais on borne quand meme
    # pour eviter qu'une version 2.0 ne casse de nouveau.
    "fastapi>=0.115,<2.0",
    "starlette>=0.40,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "tenacity>=9.0,<10.0",
    "paho-mqtt>=2.1,<3.0",
    "pyserial>=3.5,<4.0",
    "watchdog>=4.0,<7.0",
    "hl7apy>=1.3,<2.0",
    "structlog>=24.4,<26.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
bridge-server = "bridge_core.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bridge_core" = [
    "dashboard/templates/*.html",
    "dashboard/templates/partials/*.html",
    "dashboard/static/*.css",
    "dashboard/static/*.js",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
